[project]
name = "zelos"
version = "1.0.0"
description = "Zelos: evidence-gated QC agent that certifies organ-on-a-chip images as trustworthy data assets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Philip Simon Derock"}]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"src/zelos/api/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src/zelos"]

[tool.coverage.run]
source = ["src/zelos"]

[project.scripts]
zelos = "zelos.cli:app"
