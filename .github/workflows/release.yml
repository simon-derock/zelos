name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zelos:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/zelos:latest
  release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - run: tar czf zelos-results-${{ github.ref_name }}.tar.gz results
      - uses: softprops/action-gh-release@v2
        with:
          files: zelos-results-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
